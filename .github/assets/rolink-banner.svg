<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="380" viewBox="0 0 1800 380" role="img" aria-labelledby="title desc">
  <title id="title">Rolink</title>
  <desc id="desc">Rolink wordmark beside a square game node linked to a round site node.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#f1eadc"/><stop offset="1" stop-color="#c6bdb0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1800" height="380" fill="#151411"/>
  <path d="M144 190H260M1540 190H1656" stroke="#4a453b" stroke-width="2"/>
  <g transform="translate(354 78)">
    <rect x="0" y="0" width="224" height="224" rx="8" fill="none" stroke="url(#frame)" stroke-width="7"/>
    <rect x="22" y="22" width="180" height="180" rx="4" fill="none" stroke="#655f55" stroke-width="2"/>
    <rect x="46" y="88" width="48" height="48" rx="4" fill="none" stroke="#f1eadc" stroke-width="6" transform="rotate(12 70 112)"/>
    <path d="M100 104H128M128 120H100" stroke="#7d766a" stroke-width="4" stroke-linecap="round"/>
    <path d="M120 96 130 104 120 112M108 112 98 120 108 128" fill="none" stroke="#7d766a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="158" cy="112" r="24" fill="none" stroke="#e77c66" stroke-width="6"/>
    <circle cx="158" cy="112" r="24" fill="none" stroke="#e77c66" stroke-width="6" filter="url(#glow)" opacity=".32"/>
  </g>
  <g fill="#f1eadc">
    <text x="646" y="190" font-family="Inter, Arial, sans-serif" font-size="126" font-weight="600" letter-spacing="-5">Rolink</text>
    <text x="651" y="246" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" font-weight="600" letter-spacing="2" fill="#c9bfb0">TWO-WAY LINK BETWEEN ROBLOX GAMES AND WEBSITES.</text>
  </g>
  <path d="M648 282H1400" stroke="#5a5449" stroke-width="2"/>
  <path d="M648 282H870" stroke="#e77c66" stroke-width="4"/>
</svg>
